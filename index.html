<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichcontent</title>
    <link rel="shortcut icon" href="assets/logo_wichcontent_png.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a class="logo">
                <img class="logo-img" src="/assets/logo_wichcontent_png.png" alt="logo Wichcontent">
            </a>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Paquetes</a></li>
                <li><a href="index.html" class="nav-link">Servicio</a></li>
                <li><a href="index.html" class="nav-link">Proceso</a></li>
                <li><a href="index.html" class="nav-link">Contacto</a></li>
            </ul>
            <a href="#contacto" class="nav-cta">Comenzar →</a>
        </nav>
    </header>



    <main>
        <section class="hero">
            <section class="hero">
                <p class="hero-eyebrow">Soluciones digitales · Puebla, México</p>

                <h1 class="hero-title">
                    <span>Tu negocio,</span>
                    <span class="muted">visible</span>
                    <span>desde hoy.</span>
                </h1>

                <p class="hero-description">
                    Páginas web profesionales, WhatsApp optimizado y tiendas digitales.
                    Listos en días, no en meses.
                </p>

                <div class="hero-actions">
                    <a href="#paquetes" class="btn btn-primary">Ver paquetes</a>
                    <a href="#proceso" class="btn btn-secondary">Cómo funciona</a>
                </div>
            </section>

            <section id="servicios"></section>
            <section id="paquetes"></section>
            <section id="proceso"></section>
            <section id="contacto"></section>

        </section>


    </main>






</body>

</html>
